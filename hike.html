<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1cc87a" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>苏州山野 · 全域爬山指南</title>
  <meta name="description" content="按路线、风格、风景查询苏州全域爬山与徒步。" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="hike.css?v=13" />
</head>
<body>
  <div class="app" id="app">
    <section class="panel" id="browse">
      <div class="filters">
        <div class="filter"><p>风格</p><div class="chips" id="styles"></div></div>
        <div class="filter"><p>风景</p><div class="chips" id="sceneries"></div></div>
        <div class="filter"><p>区域</p><div class="chips" id="areas"></div></div>
        <div class="filter"><p>难度</p><div class="chips" id="levels"></div></div>
      </div>
      <div class="cards" id="cards"></div>
      <p class="empty" id="empty" hidden>没有匹配的路线。少选一个筛选再试。</p>
    </section>

    <article class="detail" id="detail" hidden></article>
    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" type="button" aria-label="关闭">×</button>
      <img id="lightbox-img" alt="" />
      <p id="lightbox-cap"></p>
    </div>
    <footer class="foot" id="foot">
      <p>示意片来自图库，不是路线实拍。走法综合公开攻略，雨天野路别去，魔鬼线要结伴。</p>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="hike.js?v=13"></script>
</body>
</html>
