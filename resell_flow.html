<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一键转卖 · 新版落地页全链路</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f6fa;--card:#fff;--bdr:#dde1ea;--tx:#1f2329;--sub:#6b7280;--accent:#6366f1}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);overflow:hidden;height:100vh;color:var(--tx)}

#bar{position:fixed;top:0;left:0;right:0;height:44px;background:#fff;border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:200}
#bar h1{font-size:13px;font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:3px}
.tabs button{padding:4px 14px;border:1.5px solid var(--bdr);border-radius:6px;background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--sub);transition:.15s}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.spacer{flex:1}
.hint{font-size:10px;color:var(--sub)}
.zb{display:flex;gap:3px}
.zb button{width:26px;height:26px;border:1px solid var(--bdr);border-radius:4px;background:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}

#canvas{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
#canvas.dragging{cursor:grabbing}
#world{position:absolute;transform-origin:0 0}
.view{display:none;position:relative}.view.on{display:block}

.nd{position:absolute;border-radius:9px;background:var(--card);border:1.5px solid var(--bdr);z-index:2;font-size:11px;min-width:90px;transition:opacity .15s,border-color .15s,box-shadow .15s}
.nd.dim{opacity:.1;pointer-events:none}
.nd.glow{box-shadow:0 0 0 3px rgba(99,102,241,.35)}
.nd .h{padding:5px 10px 4px;display:flex;align-items:center;gap:5px;border-bottom:1px solid #f0f0f0}
.nd .h .ic{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700;flex-shrink:0}
.nd .h .t{font-size:11px;font-weight:700;white-space:nowrap}
.nd .h .s{font-size:8px;color:var(--sub);margin-left:auto;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.nd .bd{padding:3px 6px 4px}
.nd .r{display:flex;align-items:center;gap:4px;padding:2.5px 5px;border-radius:4px;cursor:pointer;white-space:nowrap;line-height:1.3;transition:background .1s}
.nd .r:hover{background:rgba(0,0,0,.06)}
.nd .r.hl{background:rgba(99,102,241,.15);font-weight:600}
.nd .r .d{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .15s,border-color .15s}
.nd .sec{padding:1px 8px;font-size:8px;font-weight:700;color:var(--accent);background:rgba(99,102,241,.04);border-top:1px solid rgba(99,102,241,.08)}

.nd.c-entry{border-color:#475569;border-width:2px;background:#f8fafc}.nd.c-entry .h .ic{background:#475569}
.nd.c-route{border-color:#94a3b8;border-style:dashed;background:#f8fafc}.nd.c-route .h .ic{background:#64748b}
.nd.c-core{border-color:var(--accent);border-width:2px;background:#eef2ff}.nd.c-core .h{background:rgba(99,102,241,.07)}.nd.c-core .h .ic{background:var(--accent)}
.nd.c-page{border-color:#0891b2;background:#ecfeff}.nd.c-page .h .ic{background:#0891b2}
.nd.c-result{border-color:#059669;border-width:2px;background:#ecfdf5}.nd.c-result .h .ic{background:#059669}
.nd.c-popup{border-color:#8b5cf6;border-style:dashed;background:#f5f3ff}.nd.c-popup .h .ic{background:#8b5cf6}
.nd.c-exit{border-color:#64748b;background:#f1f5f9}.nd.c-exit .h .ic{background:#64748b}
.bug-badge{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;background:#dc2626;color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:700;z-index:3}


svg{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
svg path{transition:opacity .15s,stroke-width .15s}
svg path.dim{opacity:.04}svg path.hl{stroke-width:2.5 !important;opacity:1 !important}

.tip{position:fixed;background:#1f2329;color:#fff;padding:7px 11px;border-radius:7px;font-size:10.5px;pointer-events:none;z-index:300;max-width:360px;line-height:1.5;display:none;white-space:pre-line}
#reset-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;padding:6px 20px;border-radius:7px;font-size:11px;z-index:200;display:none;cursor:pointer}

/* ─── issues tab ─── */
/* 配色只用 4 种：主色 indigo / 严重红 / 重要橙 / 中性灰 */
#issues-panel{display:none;position:absolute;top:44px;left:0;right:0;bottom:0;overflow-y:auto;background:var(--bg);padding:14px 22px 48px;
  --pri:#4f46e5;--sev1:#dc2626;--sev2:#d97706;--mut:#8b93a1;--ink:#2b3038;--soft:#f1f3f7}
#issues-panel.on{display:block}

/* 顶部：范围 + 统计 + 三组筛选 */
.iss-top{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bdr)}
.iss-hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:11px}
.iss-scope{font-size:13px;color:var(--sub);line-height:1.6}
.iss-scope b{color:var(--ink);font-size:14px}
.iss-nums{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.iss-num{font-size:12px;padding:3px 11px;border-radius:12px;background:#fff;border:1px solid var(--bdr);white-space:nowrap;color:var(--sub)}
.iss-num b{font-weight:700;color:var(--ink)}
.iss-num.s-c b{color:var(--sev1)}.iss-num.s-m b{color:var(--sev2)}
.iss-num.prog{border-color:#cfd2f5;background:#f6f7fd}.iss-num.prog b{color:var(--pri)}
.iss-act{font-size:12px;padding:3px 11px;border-radius:12px;background:#fff;border:1px solid var(--bdr);color:var(--sub);cursor:pointer;font-weight:600;white-space:nowrap}
.iss-act:hover{border-color:var(--pri);color:var(--pri)}

.iss-bars{display:flex;flex-direction:column;gap:7px}
.iss-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.iss-bar .bl{font-size:11.5px;color:var(--mut);font-weight:600;min-width:56px;flex-shrink:0}
.iss-bar button{font-size:12px;padding:4px 13px;border-radius:6px;border:1px solid var(--bdr);background:#fff;color:var(--sub);cursor:pointer;font-weight:600}
.iss-bar button:hover{border-color:var(--pri);color:var(--pri)}
.iss-bar button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.iss-bar button .bn{opacity:.6;margin-left:4px;font-weight:400}

/* 维度分组 */
.dim-block{margin-bottom:16px}
.dim-block.hide{display:none}
.dim-head{display:flex;align-items:center;gap:8px;padding:5px 0 8px;cursor:pointer;user-select:none}
.dim-head h3{font-size:14.5px;font-weight:700;color:var(--ink)}
.dim-head .cnt{color:var(--mut);font-size:12px;font-weight:600}
.dim-head .arrow{font-size:9px;color:var(--mut);width:10px;transition:transform .15s}
.dim-head.collapsed .arrow{transform:rotate(-90deg)}
.dim-body.collapsed{display:none}

/* 问题卡 */
.iss-card{background:#fff;border-radius:7px;margin-bottom:7px;border:1px solid var(--bdr);overflow:hidden}
.iss-card.hide{display:none}
.iss-card.sev-c{border-left:3px solid var(--sev1)}
.iss-card.sev-m{border-left:3px solid var(--sev2)}
.iss-card.sev-l{border-left:3px solid #c8ced8}
.iss-card-head{padding:10px 13px 9px;cursor:pointer}
.iss-card-head:hover{background:#fafbfd}
.iss-line{display:flex;align-items:center;gap:9px}
.sev-badge{padding:2px 7px;border-radius:3px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;flex-shrink:0}
.sev-badge.s-c{background:var(--sev1)}.sev-badge.s-m{background:var(--sev2)}.sev-badge.s-l{background:var(--mut)}
.iss-title{font-weight:600;font-size:14px;line-height:1.5;flex:1;color:var(--ink)}
.iss-title .iid{color:var(--mut);font-weight:700;margin-right:5px}
.iss-expand{color:#c2c8d2;font-size:9px;flex-shrink:0;transition:transform .15s;transform:rotate(90deg)}
.iss-expand.closed{transform:rotate(0)}

/* 标注：是问题 / 不是问题 —— 可切换，点第二次取消 */
.iss-mark{display:flex;gap:4px;flex-shrink:0;margin-left:auto}
.iss-mark button{font-size:11.5px;padding:3px 9px;border-radius:5px;border:1px solid var(--bdr);background:#fff;color:var(--mut);cursor:pointer;font-weight:600;white-space:nowrap}
.iss-mark button:hover{border-color:var(--pri);color:var(--pri)}
.iss-mark button.on-y{background:var(--pri);border-color:var(--pri);color:#fff}
.iss-mark button.on-n{background:var(--mut);border-color:var(--mut);color:#fff}
.iss-card.mk-n{opacity:.52}
.iss-card.mk-n .iss-title{text-decoration:line-through;text-decoration-color:var(--mut)}
.iss-card.mk-y{border-left-width:5px}

/* 页面 / 模块 / 字段 —— 统一中性灰，靠标签文字区分，不靠颜色 */
.iss-meta{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0 32px}
.mt{display:inline-flex;align-items:center;font-size:11.5px;border-radius:4px;overflow:hidden;border:1px solid var(--bdr);max-width:100%}
.mt .k{padding:2px 6px;font-weight:700;background:var(--soft);color:var(--mut);flex-shrink:0}
.mt .v{padding:2px 8px;background:#fff;color:#4a5260;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-fld .v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.mt-fb{border-color:#cfd2f5}.mt-fb .k{background:#eeeffc;color:var(--pri)}.mt-fb .v{color:var(--pri);font-weight:600}

/* 详情：默认展开 */
.iss-detail{padding:3px 13px 12px 45px;font-size:13.5px;line-height:1.75;color:#3d4450}
.iss-detail.closed{display:none}
.iss-detail .desc{margin-bottom:7px}
.iss-detail .fix{background:#f6f7fd;border-left:2.5px solid var(--pri);padding:7px 11px;margin-top:8px;border-radius:0 5px 5px 0;font-size:13px}
.iss-detail .fix b{color:var(--pri)}
.iss-detail .note{font-size:12px;color:var(--mut);margin-top:6px;font-style:italic}
.iss-detail table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px;background:#fff;border:1px solid var(--bdr);border-radius:5px}
.iss-detail th{background:#f7f8fc;text-align:left;padding:5px 10px;font-weight:600;border-bottom:1px solid var(--bdr);font-size:11.5px;color:var(--sub)}
.iss-detail td{padding:5px 10px;border-bottom:1px solid #f3f4f8;vertical-align:top}
.iss-detail tr:last-child td{border-bottom:none}
.iss-detail .diff-old{color:var(--sev1);font-weight:600}
.iss-empty{text-align:center;color:var(--mut);font-size:13px;padding:30px 0}

/* ─── 手机适配 ─── */
@media (max-width:768px){
  #bar{height:auto;min-height:44px;flex-wrap:wrap;padding:6px 10px;gap:6px}
  #bar h1{font-size:12px;width:100%}
  #hint{display:none}
  .tabs{flex:1}.tabs button{padding:4px 9px;font-size:10.5px}
  #canvas,#issues-panel{top:74px}
  #issues-panel{padding:10px 12px 40px}
  .iss-scope{width:100%}
  .iss-nums{margin-left:0}
  .iss-bar .bl{min-width:auto;width:100%}
  .iss-bar button{flex:1;padding:4px 8px;font-size:11.5px}
  .iss-line{flex-wrap:wrap}
  .iss-mark{margin-left:0;width:100%;order:3;margin-top:6px}
  .iss-mark button{flex:1}
  .iss-meta{margin-left:0}
  .mt .v{white-space:normal;word-break:break-all}
  .iss-detail{padding:3px 11px 12px}
  .iss-detail table{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<div id="bar">
  <h1>新版落地页 · 全链路（串联版）</h1>
  <div class="tabs">
    <button onclick="goTab('consign')" id="tb-consign" class="on">寄售</button>
    <button onclick="goTab('recycle')" id="tb-recycle">回收</button>
    <button onclick="goTab('hall')" id="tb-hall">挂售</button>
    <button onclick="goTab('issues')" id="tb-issues">问题</button>
  </div>
  <div class="hint" id="hint">点击按钮 → 高亮整条链路 · 问题Tab → 查看全部审计发现</div>
  <div class="spacer"></div>
  <div class="zb" id="zb"><button onclick="zi()">+</button><button onclick="zo()">−</button><button onclick="zf()">⊡</button></div>
</div>
<div id="canvas"><div id="world"></div></div>
<div id="issues-panel"></div>
<div class="tip" id="tip"></div>
<div id="reset-bar" onclick="resetAll()">点击取消高亮</div>

<script>

/* ───────── BUILD ───────── */
const views={};
function build(name,nodes){
  pi=0;
  nodes.forEach(n=>{
    const ar=[];if(n.rows)ar.push(...n.rows);if(n.secs)n.secs.forEach(s=>ar.push(...s.rows));
    ar.forEach(r=>{r._c=r.to?nc():'#cbd5e1';r._rid=++_rc});
  });
  const v=document.createElement('div');v.className='view';v.id='v-'+name;
  v.style.width=W+'px';v.style.height=H+'px';
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('width',W);svg.setAttribute('height',H);
  const defs=document.createElementNS(NS,'defs');svg.appendChild(defs);
  v.appendChild(svg);
  const idx={},els={};
  nodes.forEach(n=>{idx[n.id]=n});
  nodes.forEach(n=>{const el=mkN(n,name);v.appendChild(el);els[n.id]=el});
  const edges=[];
  setTimeout(()=>{
    nodes.forEach(n=>{const e=els[n.id];n._w=e.offsetWidth;n._h=e.offsetHeight});
    nodes.forEach(n=>{
      const ar=[];if(n.rows)ar.push(...n.rows);if(n.secs)n.secs.forEach(s=>ar.push(...s.rows));
      ar.forEach(r=>{
        if(!r.to||!idx[r.to])return;
        const tgt=idx[r.to],c=r._c;
        const bel=els[n.id].querySelector(`[data-rid="${r._rid}"]`);
        let fy=n.y+(n._h||40)/2;if(bel)fy=n.y+bel.offsetTop+bel.offsetHeight/2;
        const ty2=tgt.y+(tgt._h||40)/2;
        let fx,tx2;const nR=n.x+(n._w||160),tR=tgt.x+(tgt._w||160);
        if(tgt.x>=nR-20){fx=nR;tx2=tgt.x}else if(n.x>=tR-20){fx=n.x;tx2=tR}else{fx=nR;tx2=tgt.x}
        const dx=tx2-fx,cp=Math.max(Math.abs(dx)*.3,30);
        const d2=`M${fx},${fy} C${fx+(dx>=0?cp:-cp)},${fy} ${tx2+(dx>=0?-cp:cp)},${ty2} ${tx2},${ty2}`;
        const mk=document.createElementNS(NS,'marker');mk.id=name+'-m'+r._rid;
        mk.setAttribute('markerWidth','6');mk.setAttribute('markerHeight','4');mk.setAttribute('refX','6');mk.setAttribute('refY','2');mk.setAttribute('orient','auto');
        const mp=document.createElementNS(NS,'path');mp.setAttribute('d','M0,0 L6,2 L0,4');mp.setAttribute('fill',c);mk.appendChild(mp);defs.appendChild(mk);
        const p=document.createElementNS(NS,'path');p.setAttribute('d',d2);p.setAttribute('stroke',c);p.setAttribute('stroke-width','1.4');p.setAttribute('fill','none');p.setAttribute('opacity','0.55');p.setAttribute('marker-end',`url(#${mk.id})`);
        if(n.cls==='c-popup'||tgt.cls==='c-popup')p.setAttribute('stroke-dasharray','4,3');
        svg.appendChild(p);
        edges.push({rid:r._rid,p,from:n.id,to:tgt.id,c});
      });
    });
  },80);
  world.appendChild(v);
  // Build forward adjacency for chain tracing
  const fwd={};
  nodes.forEach(n=>{
    const ar=[];if(n.rows)ar.push(...n.rows);if(n.secs)n.secs.forEach(s=>ar.push(...s.rows));
    ar.forEach(r=>{
      if(!r.to||!idx[r.to])return;
      if(!fwd[n.id])fwd[n.id]=[];
      fwd[n.id].push({to:r.to,rid:r._rid});
    });
  });
  views[name]={v,svg,nodes,idx,els,edges,fwd};
}
let _rc=0;

function mkN(n,vn){
  const el=document.createElement('div');el.className='nd '+n.cls;el.style.left=n.x+'px';el.style.top=n.y+'px';el.dataset.nid=n.id;el.dataset.vn=vn;
  let h=`<div class="h"><div class="ic">${n.ic||''}</div><div class="t">${n.t}</div>${n.s?`<div class="s">${n.s}</div>`:''}</div>`;
  const mr=r=>`<div class="r" data-rid="${r._rid}" data-vn="${vn}"><span class="d" style="background:${r._c};border-color:${r._c}"></span>${r.text}</div>`;
  if(n.secs){n.secs.forEach(s=>{h+=`<div class="sec">${s.label}</div><div class="bd">`;s.rows.forEach(r=>{h+=mr(r)});h+='</div>'})}
  else if(n.rows&&n.rows.length){h+='<div class="bd">';n.rows.forEach(r=>{h+=mr(r)});h+='</div>'}
  if(n.bug)h+=`<div class="bug-badge">!</div>`;
  el.innerHTML=h;
  el.querySelectorAll('.r').forEach(re=>{re.addEventListener('click',e=>{e.stopPropagation();hlChain(parseInt(re.dataset.rid),re.dataset.vn)})});
  return el;
}

/* ───────── CHAIN HIGHLIGHT ───────── */
function hlChain(rid,vn){
  resetAll();
  const vd=views[vn];if(!vd)return;
  // Find the row and its source node
  let srcId=null,tgtId=null;
  vd.nodes.forEach(n=>{
    const ar=[];if(n.rows)ar.push(...n.rows);if(n.secs)n.secs.forEach(s=>ar.push(...s.rows));
    ar.forEach(r=>{if(r._rid===rid){srcId=n.id;tgtId=r.to}});
  });
  if(!srcId)return;
  // BFS forward from target to find the full downstream chain
  const chain=new Set([srcId]);
  const chainEdges=new Set([rid]);
  if(tgtId&&vd.idx[tgtId]){
    // 不再按 x 坐标过滤方向：跳转后页面自身的其他跳转路径（含回跳落地页）也要一起高亮。
    // 用深度上限 + visited 去重防止枢纽节点把整张图拉亮。
    const MAXD=3;
    const q=[[tgtId,0]];const visited=new Set([srcId,tgtId]);
    chain.add(tgtId);
    while(q.length){
      const [cur2,dep]=q.shift();
      (vd.fwd[cur2]||[]).forEach(e=>{
        if(!vd.idx[e.to])return;
        chainEdges.add(e.rid);          // 回环/回跳边同样高亮
        chain.add(e.to);
        if(!visited.has(e.to)&&dep+1<MAXD){visited.add(e.to);q.push([e.to,dep+1])}
      });
    }
  }
  // Apply highlight
  Object.entries(vd.els).forEach(([id,el])=>{el.classList.toggle('dim',!chain.has(id));el.classList.toggle('glow',chain.has(id))});
  vd.edges.forEach(e=>{const hit=chainEdges.has(e.rid)||(chain.has(e.from)&&chain.has(e.to));e.p.classList.toggle('dim',!hit);e.p.classList.toggle('hl',hit);e.p.setAttribute('opacity',hit?'1':'0.55')});
  const rowEl=document.querySelector(`[data-rid="${rid}"]`);if(rowEl)rowEl.classList.add('hl');
  document.getElementById('reset-bar').style.display='block';
}


function resetAll(){
  const vd=views[cur];if(!vd)return;
  Object.values(vd.els).forEach(el=>{el.classList.remove('dim','glow')});
  vd.edges.forEach(e=>{e.p.classList.remove('dim','hl');e.p.setAttribute('opacity','0.55')});
  document.querySelectorAll('.r.hl').forEach(r=>r.classList.remove('hl'));
  document.getElementById('reset-bar').style.display='none';
}

const SEV_LABEL={c:'严重',m:'重要',l:'一般'};
const DIM_SHORT={dim1:'文案一致性',dim2:'页面结构',dim3:'可合并模块',dim4:'模块位置',dim5:'跳转异常'};
let typeFilter='all',sevFilter='all',markFilter='all';

/* 标注结果本地持久化，刷新不丢 */
const MK_KEY='resell_flow_marks_v1';
let MARKS={};
try{MARKS=JSON.parse(localStorage.getItem(MK_KEY)||'{}')||{}}catch(e){MARKS={}}
function saveMarks(){try{localStorage.setItem(MK_KEY,JSON.stringify(MARKS))}catch(e){}}
const mkOf=id=>MARKS[id]||'u';
function setMark(id,v,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  if(MARKS[id]===v)delete MARKS[id];else MARKS[id]=v;
  saveMarks();applyFilter();
}
function clearMarks(){
  if(!Object.keys(MARKS).length)return;
  MARKS={};saveMarks();applyFilter();
}
function copyMarks(){
  const all=ISSUES.flatMap(d=>d.items.map(i=>({...i,key:d.key})));
  const grp=v=>all.filter(i=>mkOf(i.id)===v);
  const fmt=a=>a.length?a.map(i=>`${i.id} [${DIM_SHORT[i.key]}/${SEV_LABEL[i.sev]}] ${i.title}`).join('\n'):'（无）';
  const txt=`一键转卖·渠道新版 问题标注结果\n\n【确认是问题 ${grp('y').length}】\n${fmt(grp('y'))}\n\n【判定不是问题 ${grp('n').length}】\n${fmt(grp('n'))}\n\n【未标记 ${grp('u').length}】\n${fmt(grp('u'))}`;
  const done=()=>{const b=document.getElementById('btn-copy');if(!b)return;b.textContent='已复制';setTimeout(()=>{b.textContent='复制标注'},1500)};
  // file:// 打开属非安全上下文，navigator.clipboard 不存在，降级到 textarea + execCommand
  const fallback=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=txt;ta.style.position='fixed';ta.style.top='-9999px';
      document.body.appendChild(ta);ta.select();
      const ok=document.execCommand('copy');
      document.body.removeChild(ta);
      ok?done():alert(txt);
    }catch(e){alert(txt)}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fallback);
  else fallback();
}

        ${ISSUES.map(d=>`<button onclick="setType('${d.key}')" id="tf-${d.key}">${DIM_SHORT[d.key]}<span class="bn" id="tn-${d.key}"></span></button>`).join('')}
      </div>
      <div class="iss-bar" id="bar-sev"><span class="bl">严重程度</span>
        <button onclick="setSev('all')" id="sf-all" class="on">全部<span class="bn" id="sn-all"></span></button>
        <button onclick="setSev('c')" id="sf-c">严重<span class="bn" id="sn-c"></span></button>
        <button onclick="setSev('m')" id="sf-m">重要<span class="bn" id="sn-m"></span></button>
        <button onclick="setSev('l')" id="sf-l">一般<span class="bn" id="sn-l"></span></button>
      </div>
      <div class="iss-bar" id="bar-mark"><span class="bl">我的判定</span>
        <button onclick="setMk('all')" id="mf-all" class="on">全部<span class="bn" id="mn-all"></span></button>
        <button onclick="setMk('y')" id="mf-y">是问题<span class="bn" id="mn-y"></span></button>
        <button onclick="setMk('n')" id="mf-n">不是问题<span class="bn" id="mn-n"></span></button>
        <button onclick="setMk('u')" id="mf-u">未标记<span class="bn" id="mn-u"></span></button>
      </div>
    </div>
  </div>`;

  ISSUES.forEach((d,di)=>{
    h+=`<div class="dim-block" id="ib-${di}" data-key="${d.key}">
      <div class="dim-head" onclick="tgDim(${di})" id="ih-${di}">
        <span class="arrow">▼</span><h3>${d.title}</h3><span class="cnt" id="ic-${di}">${d.items.length}</span>
      </div>
      <div class="dim-body" id="idb-${di}">`;
    d.items.forEach((it,ii)=>{
      const more=!!(it.desc||it.detail||it.fix);
      h+=`<div class="iss-card sev-${it.sev}" data-sev="${it.sev}" data-id="${it.id}" id="card-${it.id}">
        <div class="iss-card-head" ${more?`onclick="tgIss(${di},${ii})"`:''}>
          <div class="iss-line">
            <span class="sev-badge s-${it.sev}">${SEV_LABEL[it.sev]}</span>
            <div class="iss-title"><span class="iid">${it.id}</span>${it.title}</div>
            <div class="iss-mark">
              <button id="mky-${it.id}" onclick="setMark('${it.id}','y',event)">是问题</button>
              <button id="mkn-${it.id}" onclick="setMark('${it.id}','n',event)">不是问题</button>
            </div>
            ${more?`<span class="iss-expand" id="ie-${di}-${ii}">▶</span>`:''}
          </div>
          <div class="iss-meta">
            ${it.page?`<span class="mt"><span class="k">页面</span><span class="v">${it.page}</span></span>`:''}
            ${it.mod?`<span class="mt"><span class="k">模块</span><span class="v">${it.mod}</span></span>`:''}
            ${it.fld?`<span class="mt mt-fld"><span class="k">字段</span><span class="v">${esc(it.fld)}</span></span>`:''}
            ${it.fb?`<span class="mt mt-fb"><span class="k">反馈</span><span class="v">${it.fb}</span></span>`:''}
          </div>
        </div>`;
      if(more){
        h+=`<div class="iss-detail" id="id-${di}-${ii}">`;
        if(it.desc)h+=`<div class="desc">${it.desc}</div>`;
        if(it.detail)h+=it.detail;
        if(it.fix)h+=`<div class="fix"><b>建议 · </b>${it.fix}</div>`;
        if(it.note)h+=`<div class="note">${it.note}</div>`;
        h+=`</div>`;
      }
      h+=`</div>`;
    });
    h+=`</div></div>`;
  });
  h+=`<div class="iss-empty" id="iss-empty" style="display:none">当前筛选条件下没有问题</div>`;
  document.getElementById('issues-panel').innerHTML=h;
  applyFilter();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* 折叠：详情默认展开，点击收起 */
function tgDim(di){
  const hd=document.getElementById('ih-'+di);
  document.getElementById('idb-'+di).classList.toggle('collapsed',hd.classList.toggle('collapsed'));
}
function tgIss(di,ii){
  const d=document.getElementById(`id-${di}-${ii}`),e=document.getElementById(`ie-${di}-${ii}`);
  if(e)e.classList.toggle('closed',d.classList.toggle('closed'));
}

/* 三组筛选可叠加：问题类型 × 严重程度 × 我的判定 */
function setType(k){typeFilter=k;applyFilter()}
function setSev(s){sevFilter=s;applyFilter()}
function setMk(m){markFilter=m;applyFilter()}
function applyFilter(){
  const all=ISSUES.flatMap(d=>d.items.map(i=>({...i,key:d.key})));
  const pass=(i,t,s,m)=>(t==='all'||i.key===t)&&(s==='all'||i.sev===s)&&(m==='all'||mkOf(i.id)===m);
  // 每个按钮的计数 = 它自己的取值 + 另外两组的当前取值
  ['all',...ISSUES.map(d=>d.key)].forEach(k=>{
    document.getElementById('tf-'+k).classList.toggle('on',k===typeFilter);
    document.getElementById('tn-'+k).textContent=all.filter(i=>pass(i,k,sevFilter,markFilter)).length;
  });
  ['all','c','m','l'].forEach(s=>{
    document.getElementById('sf-'+s).classList.toggle('on',s===sevFilter);
    document.getElementById('sn-'+s).textContent=all.filter(i=>pass(i,typeFilter,s,markFilter)).length;
  });
  ['all','y','n','u'].forEach(m=>{
    document.getElementById('mf-'+m).classList.toggle('on',m===markFilter);
    document.getElementById('mn-'+m).textContent=all.filter(i=>pass(i,typeFilter,sevFilter,m)).length;
  });
  document.getElementById('mk-prog').textContent=all.filter(i=>mkOf(i.id)!=='u').length;
  // 卡片标注态与显隐
  let total=0;
  ISSUES.forEach((d,di)=>{
    let shown=0;
    d.items.forEach(it=>{
      const mk=mkOf(it.id),c=document.getElementById('card-'+it.id);
      const y=document.getElementById('mky-'+it.id),n=document.getElementById('mkn-'+it.id);
      if(y)y.classList.toggle('on-y',mk==='y');
      if(n)n.classList.toggle('on-n',mk==='n');
      if(!c)return;
      c.classList.toggle('mk-y',mk==='y');
      c.classList.toggle('mk-n',mk==='n');
      const hit=pass({...it,key:d.key},typeFilter,sevFilter,markFilter);
      c.classList.toggle('hide',!hit);if(hit)shown++;
    });
    document.getElementById('ic-'+di).textContent=shown;
    document.getElementById('ib-'+di).classList.toggle('hide',shown===0);
    total+=shown;
  });
  document.getElementById('iss-empty').style.display=total?'none':'block';
}

/* ───────── NAV ───────── */
const TABS=['consign','recycle','hall','issues'];
function goTab(t){
  resetAll();cur=t;
  TABS.forEach(k=>{document.getElementById('v-'+k)?.classList.toggle('on',k===t);document.getElementById('tb-'+k).classList.toggle('on',k===t)});
  const iss=t==='issues';
  document.getElementById('issues-panel').classList.toggle('on',iss);
  document.getElementById('canvas').style.display=iss?'none':'block';
  document.getElementById('zb').style.display=iss?'none':'flex';
  document.getElementById('hint').textContent=iss
    ?'点击维度标题 → 折叠/展开 · 点击问题卡 → 查看详情、根因与建议'
    :'点击按钮 → 高亮整条链路 · 问题Tab → 查看全部审计发现';
  if(!iss)setTimeout(zf,100);
}
function at(){world.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`}
function zf(){const cv=document.getElementById('canvas'),v=document.getElementById('v-'+cur);if(!v)return;let mx=0,my=0;v.querySelectorAll('.nd').forEach(e=>{mx=Math.max(mx,e.offsetLeft+e.offsetWidth+30);my=Math.max(my,e.offsetTop+e.offsetHeight+30)});const sx=cv.clientWidth/mx,sy=cv.clientHeight/my;sc=Math.min(sx,sy,1)*.88;tx=(cv.clientWidth-mx*sc)/2;ty=(cv.clientHeight-my*sc)/2+20;at()}
function zi(){sc=Math.min(sc*1.2,3);at()}function zo(){sc=Math.max(sc/1.2,.12);at()}

function init(){
  world=document.getElementById('world');tipEl=document.getElementById('tip');
  world.style.width=W+'px';world.style.height=H+'px';
  build('consign',mkConsign());build('recycle',mkRecycle());build('hall',mkHall());
  renderIssues();
  goTab('consign');
  const cv=document.getElementById('canvas');
  cv.addEventListener('mousedown',e=>{drag=true;cv.classList.add('dragging');ds={x:e.clientX,y:e.clientY};ps={x:tx,y:ty}});
  cv.addEventListener('mousemove',e=>{if(!drag)return;tx=ps.x+(e.clientX-ds.x);ty=ps.y+(e.clientY-ds.y);at()});
  cv.addEventListener('mouseup',()=>{drag=false;cv.classList.remove('dragging')});
  cv.addEventListener('mouseleave',()=>{drag=false;cv.classList.remove('dragging')});
  // 触摸：单指拖拽 / 双指捏合缩放
  let pd=0,pc=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  cv.addEventListener('touchstart',e=>{
    if(e.touches.length===1){drag=true;ds={x:e.touches[0].clientX,y:e.touches[0].clientY};ps={x:tx,y:ty}}
    else if(e.touches.length===2){drag=false;pd=dist(e.touches);const r=cv.getBoundingClientRect();
      pc={x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}}
  },{passive:true});
  cv.addEventListener('touchmove',e=>{
    if(e.touches.length===1&&drag){e.preventDefault();tx=ps.x+(e.touches[0].clientX-ds.x);ty=ps.y+(e.touches[0].clientY-ds.y);at()}
    else if(e.touches.length===2&&pd){e.preventDefault();const nd=dist(e.touches),os=sc;
      sc=Math.max(.12,Math.min(3,sc*(nd/pd)));pd=nd;
      tx=pc.x-(pc.x-tx)*(sc/os);ty=pc.y-(pc.y-ty)*(sc/os);at()}
  },{passive:false});
  cv.addEventListener('touchend',e=>{if(e.touches.length===0){drag=false;pd=0;pc=null}},{passive:true});
  cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,os=sc;sc*=e.deltaY<0?1.1:.9;sc=Math.max(.12,Math.min(3,sc));tx=mx-(mx-tx)*(sc/os);ty=my-(my-ty)*(sc/os);at()},{passive:false});
  cv.addEventListener('click',()=>resetAll());
  setTimeout(zf,200);
}
init();
</script>
